name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The site is plain ES modules, so there is nothing to build. The tests
      # still gate the deploy.
      - run: npm test
      # A stale stamp would deploy an app that returning visitors never see.
      - run: node tools/stamp-sw.mjs --check
      # No `enablement: true` here. Creating a Pages site needs more than the
      # default GITHUB_TOKEN has: the call comes back "Resource not accessible
      # by integration". Tested on this repository both private and public, so
      # it is a token scope limit rather than anything about visibility, and the
      # flag only adds a second red herring to an already failing log.
      # Pages is turned on once by hand, in
      # Settings -> Pages -> Source -> GitHub Actions, and every push to main
      # deploys by itself after that.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
