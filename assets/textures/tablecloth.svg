      <use href="#la" transform="translate(245 80) rotate(35) scale(1.3)"/>
      <use href="#lb" transform="translate(335 300) rotate(75) scale(1.2)"/>
      <use href="#la" transform="translate(255 205) rotate(-105) scale(1.2)"/>
      <use href="#lb" transform="translate(160 285) rotate(175) scale(1.3)"/>
      <use href="#la" transform="translate(150 20) rotate(-15) scale(1.1)"/>
      <use href="#lb" transform="translate(25 250) rotate(-125) scale(1.2)"/>
      <use href="#la" transform="translate(340 160) rotate(20) scale(1.1)"/>
      <use href="#lb" transform="translate(60 160) rotate(200)"/>
      <use href="#peony" transform="translate(90 100)"/>
      <use href="#peony" transform="translate(300 330) scale(.78)"/>
      <use href="#peony" transform="translate(205 235) scale(.65)"/>
      <use href="#bud" transform="translate(150 75) rotate(20)"/>
