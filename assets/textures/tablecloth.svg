  <rect width="360" height="360" fill="#F6F3EC"/>
  <rect width="360" height="360" fill="url(#weave)" opacity=".6"/>
  <use href="#motif" x="-360" y="-360"/><use href="#motif" x="0" y="-360"/><use href="#motif" x="360" y="-360"/>
  <use href="#motif" x="-360" y="0"/><use href="#motif" x="0" y="0"/><use href="#motif" x="360" y="0"/>
