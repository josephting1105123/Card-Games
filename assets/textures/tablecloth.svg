      <path d="M0 0C-3-4-3-9 0-12C3-9 3-4 0 0Z" fill="#F4A3AE"/>
      <path d="M-5 2C-2-1 2-1 5 2C2 5-2 5-5 2Z" fill="#2E8B57"/>
