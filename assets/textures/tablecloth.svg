      <g fill="#E8576A" stroke="#C93A4E" stroke-width="1" transform="rotate(22) scale(.74)"><use href="#r8"/></g>
      <g fill="#F4A3AE" stroke="#E27A89" stroke-width="1.4" transform="rotate(10) scale(.5)"><use href="#r6"/></g>
      <circle r="7" fill="#9E1328"/>
      <circle r="3" fill="#D9283C"/>
    </g>
    <g id="la">
      <path d="M0 0C13-10 17-34 0-56C-17-34-13-10 0 0Z" fill="#2E8B57"/>
      <path d="M0-4L0-48" fill="none" stroke="#8FD3A8" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g id="lb">
